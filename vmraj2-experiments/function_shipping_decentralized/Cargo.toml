[package]
name = "node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "node"
path = "node_rust.rs"

[dependencies]
axum          = "0.7"
tokio         = { version = "1", features = ["full"] }
reqwest       = { version = "0.12", features = ["json"] }
serde_json    = "1"
wasmtime      = "30"
wasmtime-wasi = "30"
anyhow        = "1"
